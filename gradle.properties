# [01] Use one Kotlin style and allow enough memory for its compiler work.
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# [02] These memory and cache settings help local builds reuse earlier work; they do not store the user's app
# activity.
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# [03] Use AndroidX and keep each module's generated resource names within its own scope.
android.nonTransitiveRClass=true
android.useAndroidX=true